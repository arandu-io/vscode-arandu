name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and audit the VSIX
        run: make check

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(GOWORK=off go run ./cmd/manifest-version package.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match extension version $version"
            exit 1
          fi
          VSIX="dist/arandu-${version}.vsix"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            gh release create "$TAG" "$VSIX" --verify-tag --title "$TAG" \
              --generate-notes --notes-start-tag "$previous"
          else
            gh release create "$TAG" "$VSIX" --verify-tag --title "$TAG" \
              --notes "First release."
          fi

      - name: Write it into the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --json body --jq .body)"
          day="$(gh release view "$TAG" --json publishedAt --jq .publishedAt)"
          day="${day%%T*}"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            heading="## [${TAG}](https://github.com/${REPO}/compare/${previous}...${TAG}) - ${day}"
          else
            heading="## ${TAG} - ${day}"
          fi
          git checkout main
          git pull --ff-only
          {
            head -1 CHANGELOG.md
            printf '\n%s\n\n%s\n' "$heading" "$body"
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md
          git config user.name "HYZIS"
          git config user.email "admin@hyz.is"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Write ${TAG} into the changelog"
          git push origin main
